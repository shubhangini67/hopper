<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hopper — a small job queue dashboard. Waiting, in flight, finished."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var theme = localStorage.getItem('hopper-theme');
        var night =
          theme === 'night' ||
          (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = night ? 'night' : 'day';
        var density = localStorage.getItem('hopper-density');
        if (density === 'compact') document.documentElement.dataset.density = 'compact';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
